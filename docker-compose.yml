services:

  redis:
    image: redis:latest
    container_name: rate-limiter-redis
    ports:
      - "6379:6379"

  app-1:
    build: .
    container_name: rate-limiter-app-1
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      INSTANCE_ID: app-1
    depends_on:
      - redis

  app-2:
    build: .
    container_name: rate-limiter-app-2
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      INSTANCE_ID: app-2
    depends_on:
      - redis

  nginx:
    image: nginx:latest
    container_name: rate-limiter-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-1
      - app-2