
events {}

http {
    resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;

    split_clients "$request_id" $backend {
        50% distributed-rate-limiter-2741.onrender.com;
        *   distributed-rate-limiter-2-z52o.onrender.com;
    }

    map $backend $fallback_backend {
        distributed-rate-limiter-2741.onrender.com
            distributed-rate-limiter-2-z52o.onrender.com;

        distributed-rate-limiter-2-z52o.onrender.com
            distributed-rate-limiter-2741.onrender.com;
    }

    server {
        listen 80;

        location /nginx-health {
            return 200 "OK\n";
        }

        location / {
            add_header X-Debug-Primary $backend always;

            proxy_pass https://$backend$request_uri;

            proxy_ssl_server_name on;
            proxy_ssl_name $backend;

            proxy_set_header Host $backend;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_intercept_errors on;
            error_page 502 503 504 = @fallback;
        }

        location @fallback {
            add_header X-Debug-Fallback $fallback_backend always;

            proxy_pass https://$fallback_backend$request_uri;

            proxy_ssl_server_name on;
            proxy_ssl_name $fallback_backend;

            proxy_set_header Host $fallback_backend;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
